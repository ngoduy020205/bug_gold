<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Tool System</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-panel: #141414;
            --border-normal: #333;
            --border-focus: #007acc;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent: #007acc;
            --accent-hover: #005f9e;
            --success: #4CAF50;
            --error: #f44336;
            --char-color: #9c27b0;
            --char-bg: rgba(156, 39, 176, 0.1);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-normal);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            align-self: flex-start;
            margin-top: 2vh;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-normal);
            padding-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            background: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--border-normal);
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
            text-align: center;
            font-weight: bold;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* LƯỚI CHỌN CHUNG */
        .grid-layout {
            display: grid;
            gap: 10px;
        }
        
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }

        .select-item {
            background: var(--bg-body);
            border: 1px solid var(--border-normal);
            border-radius: 4px;
            padding: 14px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .select-item:hover { border-color: #555; }

        /* Nút Gói Quà */
        .pkg-item.active {
            border-color: var(--accent);
            background: rgba(0, 122, 204, 0.1);
            color: var(--accent);
        }

        /* Nút Nhân Vật */
        .char-item.active {
            border-color: var(--char-color);
            background: var(--char-bg);
            color: var(--char-color);
        }

        /* MENU XỔ XUỐNG (DROPDOWN) */
        .dropdown-header {
            background: var(--bg-body);
            border: 1px solid var(--border-normal);
            padding: 12px 15px;
            border-radius: 4px;
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            user-select: none;
            transition: all 0.2s ease;
        }

        .dropdown-header:hover { border-color: #555; }
        .dropdown-header.open {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.action-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            margin-top: 5px;
        }

        button.action-btn:hover { background: var(--accent-hover); }
        button.action-btn:disabled { background: var(--border-normal); color: var(--text-muted); cursor: not-allowed; }

        .log-box {
            margin-top: 20px;
            background: var(--bg-body);
            border: 1px solid var(--border-normal);
            border-radius: 4px;
            height: 180px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-row { margin-bottom: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px; }
        .log-success { color: var(--success); }
        .log-error { color: var(--error); }
        .log-sys { color: var(--text-muted); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @media (max-width: 400px) {
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="panel">
    <h2>Auto Buy System</h2>
